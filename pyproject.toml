[project]
name = "memkit"
version = "0.1.0"
description = "Drop-in short-term + long-term memory for chatbots and agents. STM summarizes with archived-transcript recovery tools; LTM is a Claude Code-style file memory maintained in the background."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "tiktoken>=0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memkit"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
